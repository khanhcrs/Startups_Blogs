name: Startups & Blogs Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/setup-ec2-apigateway

jobs:
  # -------------------------------------------------------------
  # Job 1: Kiểm tra & Áp dụng Hạ tầng bằng Terraform (IaC)
  # -------------------------------------------------------------
  terraform:
    name: Terraform Infrastructure (IaC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: cd terraform && terraform init

      - name: Terraform Format & Validate
        run: cd terraform && terraform validate

      - name: Terraform Plan
        run: cd terraform && terraform plan

  # -------------------------------------------------------------
  # Job 2: Build & Deploy Frontend React lên AWS S3 + CloudFront
  # -------------------------------------------------------------
  deploy-frontend:
    name: Build & Deploy Frontend (React)
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Build Frontend
        run: cd frontend && npm run build
        env:
          VITE_API_URL: https://kk4wz3gg94.execute-api.us-east-1.amazonaws.com

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Dist to S3 Bucket
        run: |
          aws s3 sync frontend/dist s3://startups-blogs-frontend --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E3LQS4AJOMCCZG --paths "/*"
