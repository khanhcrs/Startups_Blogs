name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Frontend / build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Validate production Cognito configuration
        env:
          VITE_AWS_REGION: ${{ vars.VITE_AWS_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
        run: |
          test -n "$VITE_AWS_REGION"
          test -n "$VITE_COGNITO_USER_POOL_ID"
          test -n "$VITE_COGNITO_CLIENT_ID"

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://kk4wz3gg94.execute-api.us-east-1.amazonaws.com
          VITE_AWS_REGION: ${{ vars.VITE_AWS_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload static files
        run: aws s3 sync frontend/dist s3://startups-blogs-frontend --delete --exclude index.html --cache-control "public,max-age=300"

      - name: Upload application entry point
        run: aws s3 cp frontend/dist/index.html s3://startups-blogs-frontend/index.html --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html"

      - name: Invalidate CloudFront cache and wait
        id: invalidate
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id E3LQS4AJOMCCZG \
            --paths "/index.html" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id E3LQS4AJOMCCZG \
            --id "$invalidation_id"
          echo "id=$invalidation_id" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed site
        id: smoke-test
        run: |
          domain=$(aws cloudfront get-distribution \
            --id E3LQS4AJOMCCZG \
            --query 'Distribution.DomainName' \
            --output text)
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "https://$domain/" > /dev/null
          echo "url=https://$domain/" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        run: |
          echo "## Frontend deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.smoke-test.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CloudFront invalidation: \`${{ steps.invalidate.outputs.id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke test: passed" >> "$GITHUB_STEP_SUMMARY"
